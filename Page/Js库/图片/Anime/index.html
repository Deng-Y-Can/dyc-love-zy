<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.js 动画演示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            position: relative;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b, #86a8e7, #91eae4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        
        /* 导航样式 */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .nav-item {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .nav-item.active {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #000;
            font-weight: 600;
        }
        
        /* 主内容区 */
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        /* 控制面板 */
        .control-panel {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .control-panel h2 {
            margin-bottom: 20px;
            color: #feb47b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-group h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #86a8e7;
        }
        
        .slider-container {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff7e5f;
            cursor: pointer;
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        button.primary {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #000;
            font-weight: 600;
        }
        
        button.primary:hover {
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
        }
        
        /* 动画演示区 */
        .animation-area {
            flex: 2;
            min-width: 300px;
            min-height: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }
        
        .animation-area h2 {
            margin-bottom: 20px;
            color: #91eae4;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* 动画元素 */
        .animation-box {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .demo-element {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        
        .circle {
            border-radius: 50%;
            background: linear-gradient(135deg, #86a8e7, #91eae4);
        }
        
        .triangle {
            width: 0;
            height: 0;
            background: transparent !important;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 52px solid #7bff8d;
        }
        
        .demo-element i {
            font-size: 1.5rem;
        }
        
        .pulse {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }
        
        /* 动画示例展示 */
        .animation-examples {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .example-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .example-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-5px);
        }
        
        .example-card h3 {
            margin-bottom: 10px;
            color: #feb47b;
        }
        
        .example-card p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .example-preview {
            width: 100%;
            height: 100px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .preview-item {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #86a8e7, #91eae4);
        }
        
        /* 页脚 */
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .main-content {
                flex-direction: column;
            }
            
            .control-panel, .animation-area {
                width: 100%;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .nav-item {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .animation-examples {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .animation-examples {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Anime.js 动画工坊</h1>
            <p class="subtitle">使用强大的 Anime.js 库创建流畅的 JavaScript 动画</p>
        </header>
        
        <nav>
            <div class="nav-item active" data-animation="basic">基础动画</div>
            <div class="nav-item" data-animation="timeline">时间线</div>
            <div class="nav-item" data-animation="svg">SVG动画</div>
            <div class="nav-item" data-animation="stagger">交错动画</div>
            <div class="nav-item" data-animation="path">路径动画</div>
        </nav>
        
        <div class="main-content">
            <div class="control-panel">
                <h2><i class="fas fa-sliders-h"></i> 动画控制</h2>
                
                <div class="control-group">
                    <h3>动画属性</h3>
                    <div class="slider-container">
                        <label for="duration">持续时间: <span id="duration-value">1000</span>ms</label>
                        <input type="range" id="duration" min="100" max="3000" value="1000" step="100">
                    </div>
                    
                    <div class="slider-container">
                        <label for="delay">延迟: <span id="delay-value">0</span>ms</label>
                        <input type="range" id="delay" min="0" max="2000" value="0" step="100">
                    </div>
                    
                    <div class="slider-container">
                        <label for="elasticity">弹性: <span id="elasticity-value">0.1</span></label>
                        <input type="range" id="elasticity" min="0" max="1" value="0.1" step="0.1">
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>动画类型</h3>
                    <div class="btn-group">
                        <button class="animation-btn" data-type="translate">移动</button>
                        <button class="animation-btn" data-type="rotate">旋转</button>
                        <button class="animation-btn" data-type="scale">缩放</button>
                        <button class="animation-btn" data-type="color">颜色</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>缓动函数</h3>
                    <div class="btn-group">
                        <button class="easing-btn" data-easing="linear">线性</button>
                        <button class="easing-btn" data-easing="easeInOutSine">缓入缓出</button>
                        <button class="easing-btn" data-easing="spring">弹性</button>
                        <button class="easing-btn" data-easing="easeOutBack">回弹</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>动画控制</h3>
                    <div class="btn-group">
                        <button class="primary" id="play-btn"><i class="fas fa-play"></i> 播放</button>
                        <button id="pause-btn"><i class="fas fa-pause"></i> 暂停</button>
                        <button id="reverse-btn"><i class="fas fa-backward"></i> 反转</button>
                        <button id="reset-btn"><i class="fas fa-redo"></i> 重置</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>创建新元素</h3>
                    <div class="btn-group">
                        <button id="add-square"><i class="fas fa-square"></i> 方形</button>
                        <button id="add-circle"><i class="fas fa-circle"></i> 圆形</button>
                        <button id="add-triangle"><i class="fas fa-play"></i> 三角形</button>
                        <button id="clear-all"><i class="fas fa-trash"></i> 清除</button>
                    </div>
                </div>
            </div>
            
            <div class="animation-area">
                <h2><i class="fas fa-play-circle"></i> 动画演示区</h2>
                <div class="animation-box" id="animation-box">
                    <div class="demo-element" id="main-element">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="demo-element circle" style="top: 150px; left: 100px;">
                        <i class="fas fa-circle"></i>
                    </div>
                    <div class="demo-element triangle" style="top: 250px; left: 200px;"></div>
                </div>
                
                <div class="animation-examples">
                    <div class="example-card" data-example="bounce">
                        <div class="example-preview">
                            <div class="preview-item" id="preview-bounce"></div>
                        </div>
                        <h3>弹跳效果</h3>
                        <p>模拟重力弹跳的动画效果</p>
                    </div>
                    
                    <div class="example-card" data-example="pulse">
                        <div class="example-preview">
                            <div class="preview-item" id="preview-pulse"></div>
                        </div>
                        <h3>脉动效果</h3>
                        <p>元素有节奏地缩放，创建脉动效果</p>
                    </div>
                    
                    <div class="example-card" data-example="shake">
                        <div class="example-preview">
                            <div class="preview-item" id="preview-shake"></div>
                        </div>
                        <h3>抖动效果</h3>
                        <p>元素快速左右抖动，吸引注意力</p>
                    </div>
                    
                    <div class="example-card" data-example="rainbow">
                        <div class="example-preview">
                            <div class="preview-item" id="preview-rainbow"></div>
                        </div>
                        <h3>彩虹渐变</h3>
                        <p>颜色在彩虹色之间平滑过渡</p>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Anime.js 动画演示 | 使用 Anime.js v3.2.1 | 设计用于展示动画能力</p>
            <p>点击动画元素查看交互效果 | 使用控制面板调整动画参数</p>
        </footer>
    </div>

    <script>
        // 全局变量
        let currentAnimation = null;
        let animationElements = [];
        let isPlaying = false;
        let currentEasing = 'easeInOutSine';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 获取主要元素
            const mainElement = document.getElementById('main-element');
            const animationBox = document.getElementById('animation-box');
            
            // 添加初始元素到动画元素数组
            animationElements = [
                mainElement,
                document.querySelector('.circle'),
                document.querySelector('.triangle')
            ];
            
            // 为每个元素添加点击事件
            animationElements.forEach(element => {
                element.addEventListener('click', function(e) {
                    createPulse(e.clientX - animationBox.getBoundingClientRect().left, 
                               e.clientY - animationBox.getBoundingClientRect().top);
                    elementClickAnimation(this);
                });
            });
            
            // 导航点击事件
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                    const animationType = this.getAttribute('data-animation');
                    changeAnimationType(animationType);
                });
            });
            
            // 动画类型按钮点击事件
            document.querySelectorAll('.animation-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const animationType = this.getAttribute('data-type');
                    playAnimation(animationType);
                });
            });
            
            // 缓动函数按钮点击事件
            document.querySelectorAll('.easing-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.easing-btn').forEach(b => b.classList.remove('primary'));
                    this.classList.add('primary');
                    currentEasing = this.getAttribute('data-easing');
                });
            });
            
            // 默认选中第一个缓动函数按钮
            document.querySelector('.easing-btn').classList.add('primary');
            
            // 控制按钮事件
            document.getElementById('play-btn').addEventListener('click', function() {
                if (currentAnimation) {
                    currentAnimation.play();
                    isPlaying = true;
                    updatePlayButton();
                }
            });
            
            document.getElementById('pause-btn').addEventListener('click', function() {
                if (currentAnimation) {
                    currentAnimation.pause();
                    isPlaying = false;
                    updatePlayButton();
                }
            });
            
            document.getElementById('reverse-btn').addEventListener('click', function() {
                if (currentAnimation) {
                    currentAnimation.reverse();
                    isPlaying = !isPlaying;
                    updatePlayButton();
                }
            });
            
            document.getElementById('reset-btn').addEventListener('click', function() {
                resetAnimation();
            });
            
            // 添加元素按钮事件
            document.getElementById('add-square').addEventListener('click', function() {
                addElement('square');
            });
            
            document.getElementById('add-circle').addEventListener('click', function() {
                addElement('circle');
            });
            
            document.getElementById('add-triangle').addEventListener('click', function() {
                addElement('triangle');
            });
            
            document.getElementById('clear-all').addEventListener('click', function() {
                clearAllElements();
            });
            
            // 示例卡片点击事件
            document.querySelectorAll('.example-card').forEach(card => {
                card.addEventListener('click', function() {
                    const exampleType = this.getAttribute('data-example');
                    playExampleAnimation(exampleType);
                });
            });
            
            // 滑块事件
            document.getElementById('duration').addEventListener('input', function() {
                document.getElementById('duration-value').textContent = this.value;
            });
            
            document.getElementById('delay').addEventListener('input', function() {
                document.getElementById('delay-value').textContent = this.value;
            });
            
            document.getElementById('elasticity').addEventListener('input', function() {
                document.getElementById('elasticity-value').textContent = this.value;
            });
            
            // 初始化一个基础动画
            playAnimation('translate');
            
            // 启动示例预览动画
            startPreviewAnimations();
        });
        
        // 播放动画
        function playAnimation(type) {
            const duration = parseInt(document.getElementById('duration').value);
            const delay = parseInt(document.getElementById('delay').value);
            const elasticity = parseFloat(document.getElementById('elasticity').value);
            
            // 停止当前动画
            if (currentAnimation) {
                currentAnimation.pause();
            }
            
            // 根据类型创建不同动画
            switch(type) {
                case 'translate':
                    currentAnimation = anime({
                        targets: animationElements,
                        translateX: function() {
                            return anime.random(-200, 200);
                        },
                        translateY: function() {
                            return anime.random(-150, 150);
                        },
                        duration: duration,
                        delay: function(el, i) {
                            return delay + (i * 100);
                        },
                        easing: currentEasing,
                        elasticity: elasticity * 100,
                        loop: true,
                        direction: 'alternate'
                    });
                    break;
                    
                case 'rotate':
                    currentAnimation = anime({
                        targets: animationElements,
                        rotate: function() {
                            return anime.random(0, 360);
                        },
                        duration: duration,
                        delay: function(el, i) {
                            return delay + (i * 100);
                        },
                        easing: currentEasing,
                        elasticity: elasticity * 100,
                        loop: true,
                        direction: 'alternate'
                    });
                    break;
                    
                case 'scale':
                    currentAnimation = anime({
                        targets: animationElements,
                        scale: function() {
                            return anime.random(0.5, 1.5);
                        },
                        duration: duration,
                        delay: function(el, i) {
                            return delay + (i * 100);
                        },
                        easing: currentEasing,
                        elasticity: elasticity * 100,
                        loop: true,
                        direction: 'alternate'
                    });
                    break;
                    
                case 'color':
                    currentAnimation = anime({
                        targets: animationElements,
                        backgroundColor: function() {
                            const colors = ['#FF7E5F', '#FEB47B', '#86A8E7', '#91EAE4', '#7BFF8D'];
                            return colors[anime.random(0, colors.length-1)];
                        },
                        duration: duration,
                        delay: function(el, i) {
                            return delay + (i * 100);
                        },
                        easing: currentEasing,
                        loop: true,
                        direction: 'alternate'
                    });
                    break;
            }
            
            isPlaying = true;
            updatePlayButton();
        }
        
        // 元素点击动画
        function elementClickAnimation(element) {
            anime({
                targets: element,
                scale: [1, 1.2, 1],
                rotate: [0, 10, -10, 0],
                duration: 300,
                easing: 'spring(1, 80, 10, 0)'
            });
        }
        
        // 创建脉冲效果
        function createPulse(x, y) {
            const pulse = document.createElement('div');
            pulse.className = 'pulse';
            pulse.style.left = x + 'px';
            pulse.style.top = y + 'px';
            
            document.getElementById('animation-box').appendChild(pulse);
            
            anime({
                targets: pulse,
                width: ['20px', '100px'],
                height: ['20px', '100px'],
                opacity: [0.7, 0],
                duration: 800,
                easing: 'easeOutQuad',
                complete: function() {
                    pulse.remove();
                }
            });
        }
        
        // 添加新元素
        function addElement(type) {
            const animationBox = document.getElementById('animation-box');
            const colors = ['#FF7E5F', '#FEB47B', '#86A8E7', '#91EAE4', '#7BFF8D'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const element = document.createElement('div');
            element.className = 'demo-element';
            
            // 随机位置
            const maxX = animationBox.clientWidth - 60;
            const maxY = animationBox.clientHeight - 60;
            const x = Math.floor(Math.random() * maxX);
            const y = Math.floor(Math.random() * maxY);
            
            element.style.left = x + 'px';
            element.style.top = y + 'px';
            
            // 根据类型设置样式
            if (type === 'circle') {
                element.classList.add('circle');
                element.innerHTML = '<i class="fas fa-circle"></i>';
                element.style.background = `linear-gradient(135deg, ${color}, ${color}99)`;
            } else if (type === 'triangle') {
                element.classList.add('triangle');
                element.style.borderBottomColor = color;
            } else {
                element.innerHTML = '<i class="fas fa-square"></i>';
                element.style.background = `linear-gradient(135deg, ${color}, ${color}99)`;
            }
            
            // 添加点击事件
            element.addEventListener('click', function(e) {
                createPulse(e.clientX - animationBox.getBoundingClientRect().left, 
                           e.clientY - animationBox.getBoundingClientRect().top);
                elementClickAnimation(this);
            });
            
            animationBox.appendChild(element);
            animationElements.push(element);
            
            // 为新元素添加轻微入场动画
            anime({
                targets: element,
                scale: [0, 1],
                rotate: [180, 0],
                duration: 500,
                easing: 'spring(1, 80, 10, 0)'
            });
        }
        
        // 清除所有元素
        function clearAllElements() {
            const animationBox = document.getElementById('animation-box');
            const elements = animationBox.querySelectorAll('.demo-element');
            
            // 为每个元素添加消失动画
            anime({
                targets: elements,
                scale: 0,
                rotate: 180,
                opacity: 0,
                duration: 500,
                easing: 'easeInOutQuad',
                delay: function(el, i) { return i * 50; },
                complete: function() {
                    elements.forEach(el => el.remove());
                    animationElements = [];
                    
                    // 重新添加默认元素
                    const mainElement = document.createElement('div');
                    mainElement.className = 'demo-element';
                    mainElement.id = 'main-element';
                    mainElement.innerHTML = '<i class="fas fa-star"></i>';
                    mainElement.style.left = '50%';
                    mainElement.style.top = '50%';
                    
                    const circle = document.createElement('div');
                    circle.className = 'demo-element circle';
                    circle.innerHTML = '<i class="fas fa-circle"></i>';
                    circle.style.top = '150px';
                    circle.style.left = '100px';
                    
                    const triangle = document.createElement('div');
                    triangle.className = 'demo-element triangle';
                    triangle.style.top = '250px';
                    triangle.style.left = '200px';
                    
                    animationBox.appendChild(mainElement);
                    animationBox.appendChild(circle);
                    animationBox.appendChild(triangle);
                    
                    animationElements = [mainElement, circle, triangle];
                    
                    // 为新元素添加点击事件
                    animationElements.forEach(element => {
                        element.addEventListener('click', function(e) {
                            createPulse(e.clientX - animationBox.getBoundingClientRect().left, 
                                       e.clientY - animationBox.getBoundingClientRect().top);
                            elementClickAnimation(this);
                        });
                    });
                    
                    // 为新元素添加入场动画
                    anime({
                        targets: animationElements,
                        scale: [0, 1],
                        rotate: [180, 0],
                        duration: 600,
                        easing: 'spring(1, 80, 10, 0)',
                        delay: function(el, i) { return i * 100; }
                    });
                }
            });
        }
        
        // 重置动画
        function resetAnimation() {
            if (currentAnimation) {
                currentAnimation.pause();
                currentAnimation.seek(0);
            }
            
            anime({
                targets: animationElements,
                translateX: 0,
                translateY: 0,
                rotate: 0,
                scale: 1,
                backgroundColor: function(el) {
                    return window.getComputedStyle(el).backgroundColor;
                },
                duration: 500,
                easing: 'easeOutQuad'
            });
            
            isPlaying = false;
            updatePlayButton();
        }
        
        // 更新播放按钮状态
        function updatePlayButton() {
            const playBtn = document.getElementById('play-btn');
            if (isPlaying) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停';
                playBtn.classList.remove('primary');
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i> 播放';
                playBtn.classList.add('primary');
            }
        }
        
        // 更改动画类型
        function changeAnimationType(type) {
            // 这里可以扩展为不同的动画类型
            console.log('切换到动画类型:', type);
        }
        
        // 播放示例动画
        function playExampleAnimation(example) {
            const targets = animationElements;
            
            switch(example) {
                case 'bounce':
                    anime({
                        targets: targets,
                        translateY: [0, -100, 0],
                        duration: 800,
                        easing: 'easeOutBounce',
                        loop: true,
                        delay: function(el, i) { return i * 100; }
                    });
                    break;
                    
                case 'pulse':
                    anime({
                        targets: targets,
                        scale: [1, 1.1, 1],
                        duration: 600,
                        easing: 'easeInOutSine',
                        loop: true,
                        direction: 'alternate',
                        delay: function(el, i) { return i * 150; }
                    });
                    break;
                    
                case 'shake':
                    anime({
                        targets: targets,
                        translateX: [0, 15, -15, 15, -15, 0],
                        duration: 600,
                        easing: 'easeInOutSine',
                        loop: true,
                        delay: function(el, i) { return i * 100; }
                    });
                    break;
                    
                case 'rainbow':
                    anime({
                        targets: targets,
                        backgroundColor: [
                            {value: '#FF7E5F'},
                            {value: '#FEB47B'},
                            {value: '#86A8E7'},
                            {value: '#91EAE4'},
                            {value: '#7BFF8D'},
                            {value: '#FF7E5F'}
                        ],
                        duration: 3000,
                        easing: 'linear',
                        loop: true,
                        direction: 'alternate',
                        delay: function(el, i) { return i * 200; }
                    });
                    break;
            }
        }
        
        // 启动预览动画
        function startPreviewAnimations() {
            // 弹跳预览
            anime({
                targets: '#preview-bounce',
                translateY: [0, -30, 0],
                duration: 800,
                easing: 'easeOutBounce',
                loop: true
            });
            
            // 脉动预览
            anime({
                targets: '#preview-pulse',
                scale: [1, 1.3, 1],
                duration: 1000,
                easing: 'easeInOutSine',
                loop: true,
                direction: 'alternate'
            });
            
            // 抖动预览
            anime({
                targets: '#preview-shake',
                translateX: [0, 10, -10, 10, -10, 0],
                duration: 800,
                easing: 'easeInOutSine',
                loop: true
            });
            
            // 彩虹预览
            anime({
                targets: '#preview-rainbow',
                backgroundColor: [
                    {value: '#FF7E5F'},
                    {value: '#FEB47B'},
                    {value: '#86A8E7'},
                    {value: '#91EAE4'},
                    {value: '#7BFF8D'},
                    {value: '#FF7E5F'}
                ],
                duration: 2000,
                easing: 'linear',
                loop: true
            });
        }
    </script>
</body>
</html>
