<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能全面的WebGIS系统 - openlayer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 自定义通知系统 */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
        }

        .notification {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-left: 4px solid #3498db;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

            .notification.show {
                transform: translateX(0);
            }

            .notification.success {
                border-left-color: #2ecc71;
            }

            .notification.error {
                border-left-color: #e74c3c;
            }

            .notification.warning {
                border-left-color: #f39c12;
            }

            .notification.info {
                border-left-color: #3498db;
            }

        .notification-icon {
            font-size: 1.2rem;
            margin-top: 2px;
        }

        .notification.success .notification-icon {
            color: #2ecc71;
        }

        .notification.error .notification-icon {
            color: #e74c3c;
        }

        .notification.warning .notification-icon {
            color: #f39c12;
        }

        .notification.info .notification-icon {
            color: #3498db;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .notification-message {
            color: #666;
            font-size: 0.95rem;
        }

        .notification-close {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
            line-height: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }

            to {
                transform: translateX(0);
            }
        }

        /* 控制面板 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 350px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .panel-collapsed {
            transform: translateX(-85%);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

            .panel-header h2 {
                color: #2c3e50;
                font-size: 1.5rem;
                display: flex;
                align-items: center;
                gap: 10px;
            }

        .toggle-btn {
            background: #3498db;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

            .toggle-btn:hover {
                background: #2980b9;
                transform: rotate(90deg);
            }

        /* 选项卡样式 */
        .tab-container {
            margin-bottom: 25px;
        }

        .tab-buttons {
            display: flex;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

            .tab-btn.active {
                background: white;
                color: #3498db;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: block;
            }

        /* 工具按钮组 */
        .tool-group {
            margin-bottom: 20px;
        }

            .tool-group h3 {
                color: #2c3e50;
                margin-bottom: 15px;
                font-size: 1.1rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .tool-btn {
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #333;
        }

            .tool-btn:hover {
                border-color: #3498db;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
            }

            .tool-btn.active {
                background: #3498db;
                color: white;
                border-color: #3498db;
            }

            .tool-btn i {
                font-size: 1.2rem;
            }

        /* 工具栏 */
        .main-toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .main-tool-btn {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.98);
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #2c3e50;
            transition: all 0.3s ease;
            position: relative;
        }

            .main-tool-btn:hover {
                background: #3498db;
                color: white;
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
            }

            .main-tool-btn.active {
                background: #2980b9;
                color: white;
            }

        .tool-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* 图层列表 */
        .layer-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }

            .layer-item:hover {
                background: #e9ecef;
                border-color: #3498db;
            }

        .layer-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .layer-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
        }

            .layer-icon.osm {
                background: #4CAF50;
            }

            .layer-icon.satellite {
                background: #2196F3;
            }

            .layer-icon.terrain {
                background: #795548;
            }

            .layer-icon.vector {
                background: #E91E63;
            }

            .layer-icon.measure {
                background: #FF9800;
            }

        .layer-details {
            flex: 1;
        }

        .layer-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }

        .layer-type {
            font-size: 0.8rem;
            color: #666;
        }

        /* 切换开关 */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 26px;
        }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

            .slider:before {
                position: absolute;
                content: "";
                height: 18px;
                width: 18px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                transition: .4s;
                border-radius: 50%;
            }

        input:checked + .slider {
            background-color: #3498db;
        }

            input:checked + .slider:before {
                transform: translateX(26px);
            }

        /* 查询面板 */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

            .search-input:focus {
                outline: none;
                border-color: #3498db;
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #3498db;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

            .search-btn:hover {
                background: #2980b9;
                transform: translateY(-50%) rotate(15deg);
            }

        /* 结果面板 */
        .results-panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .result-item {
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.3s ease;
        }

            .result-item:hover {
                border-color: #3498db;
                transform: translateX(5px);
            }

        .result-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .result-details {
            font-size: 0.85rem;
            color: #666;
        }

        /* 坐标显示 */
        .coordinate-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Consolas', monospace;
            z-index: 1000;
            min-width: 250px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .coord-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .coord-label {
            color: #bbb;
        }

        .coord-value {
            color: white;
            font-weight: 500;
        }

        /* 样式选择器 */
        .style-picker {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

            .color-option:hover {
                transform: scale(1.1);
            }

            .color-option.selected {
                border-color: #333;
                transform: scale(1.1);
            }

        /* 加载动画 */
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

            .loader i {
                font-size: 2rem;
                margin-bottom: 10px;
                color: #3498db;
                animation: spin 1s linear infinite;
            }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 属性表格 */
        .attribute-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

            .attribute-table th,
            .attribute-table td {
                padding: 8px;
                text-align: left;
                border-bottom: 1px solid #eee;
            }

            .attribute-table th {
                background: #f8f9fa;
                font-weight: 600;
                color: #333;
            }

            .attribute-table tr:hover {
                background: #f0f7ff;
            }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .control-panel {
                width: 300px;
                top: 10px;
                left: 10px;
            }

            .main-toolbar {
                top: 10px;
                right: 10px;
            }

            .tool-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 自定义通知容器 -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- 控制面板 -->
    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h2><i class="fas fa-map-marked-alt"></i> WebGIS 系统</h2>
            <button class="toggle-btn" id="togglePanel">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>

        <!-- 选项卡 -->
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="layers"><i class="fas fa-layer-group"></i> 图层</button>
                <button class="tab-btn" data-tab="tools"><i class="fas fa-tools"></i> 工具</button>
                <button class="tab-btn" data-tab="query"><i class="fas fa-search"></i> 查询</button>
                <button class="tab-btn" data-tab="styles"><i class="fas fa-palette"></i> 样式</button>
                <button class="tab-btn" data-tab="data"><i class="fas fa-database"></i> 数据</button>
            </div>

            <!-- 图层管理 -->
            <div class="tab-content active" id="layers">
                <div class="tool-group">
                    <h3><i class="fas fa-layer-group"></i> 底图图层</h3>
                    <div class="layer-list" id="baseLayerList">
                        <!-- 底图图层动态生成 -->
                    </div>
                </div>

                <div class="tool-group">
                    <h3><i class="fas fa-draw-polygon"></i> 矢量图层</h3>
                    <div class="layer-list" id="vectorLayerList">
                        <!-- 矢量图层动态生成 -->
                    </div>
                </div>
            </div>

            <!-- 工具面板 -->
            <div class="tab-content" id="tools">
                <div class="tool-group">
                    <h3><i class="fas fa-draw-polygon"></i> 绘制工具</h3>
                    <div class="tool-grid">
                        <button class="tool-btn" id="drawPoint">
                            <i class="fas fa-map-pin"></i>
                            <span>点</span>
                        </button>
                        <button class="tool-btn" id="drawLine">
                            <i class="fas fa-slash"></i>
                            <span>线</span>
                        </button>
                        <button class="tool-btn" id="drawPolygon">
                            <i class="fas fa-draw-polygon"></i>
                            <span>多边形</span>
                        </button>
                        <button class="tool-btn" id="drawCircle">
                            <i class="fas fa-circle"></i>
                            <span>圆形</span>
                        </button>
                        <button class="tool-btn" id="drawRectangle">
                            <i class="fas fa-square"></i>
                            <span>矩形</span>
                        </button>
                        <button class="tool-btn" id="drawText">
                            <i class="fas fa-font"></i>
                            <span>标注</span>
                        </button>
                    </div>
                </div>

                <div class="tool-group">
                    <h3><i class="fas fa-ruler-combined"></i> 测量工具</h3>
                    <div class="tool-grid">
                        <button class="tool-btn" id="measureLength">
                            <i class="fas fa-ruler-horizontal"></i>
                            <span>长度</span>
                        </button>
                        <button class="tool-btn" id="measureArea">
                            <i class="fas fa-ruler-combined"></i>
                            <span>面积</span>
                        </button>
                        <button class="tool-btn" id="measureAngle">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>角度</span>
                        </button>
                        <button class="tool-btn" id="measureClear">
                            <i class="fas fa-trash-alt"></i>
                            <span>清除</span>
                        </button>
                    </div>
                </div>

                <div class="tool-group">
                    <h3><i class="fas fa-edit"></i> 编辑工具</h3>
                    <div class="tool-grid">
                        <button class="tool-btn" id="editSelect">
                            <i class="fas fa-mouse-pointer"></i>
                            <span>选择</span>
                        </button>
                        <button class="tool-btn" id="editMove">
                            <i class="fas fa-arrows-alt"></i>
                            <span>移动</span>
                        </button>
                        <button class="tool-btn" id="editDelete">
                            <i class="fas fa-trash"></i>
                            <span>删除</span>
                        </button>
                        <button class="tool-btn" id="editClear">
                            <i class="fas fa-broom"></i>
                            <span>清空</span>
                        </button>
                    </div>
                </div>

                <div class="tool-group">
                    <h3><i class="fas fa-map-marker-alt"></i> 高级工具</h3>
                    <div class="tool-grid">
                        <button class="tool-btn" id="toolBuffer">
                            <i class="fas fa-bullseye"></i>
                            <span>缓冲区</span>
                        </button>
                        <button class="tool-btn" id="toolUnion">
                            <i class="fas fa-object-group"></i>
                            <span>合并</span>
                        </button>
                        <button class="tool-btn" id="toolIntersect">
                            <i class="fas fa-object-intersect"></i>
                            <span>相交</span>
                        </button>
                        <button class="tool-btn" id="toolExport">
                            <i class="fas fa-file-export"></i>
                            <span>导出</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 查询面板 -->
            <div class="tab-content" id="query">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索位置或要素...">
                    <button class="search-btn" id="searchButton">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div class="loader" id="searchLoader">
                    <i class="fas fa-spinner"></i>
                    <div>搜索中...</div>
                </div>

                <div class="results-panel" id="resultsPanel">
                    <!-- 搜索结果动态生成 -->
                </div>

                <div style="margin-top: 20px;">
                    <h3><i class="fas fa-filter"></i> 空间查询</h3>
                    <div class="tool-grid" style="margin-top: 15px;">
                        <button class="tool-btn" id="queryPoint">
                            <i class="fas fa-map-pin"></i>
                            <span>点查询</span>
                        </button>
                        <button class="tool-btn" id="queryBuffer">
                            <i class="fas fa-bullseye"></i>
                            <span>缓冲区</span>
                        </button>
                        <button class="tool-btn" id="queryIntersect">
                            <i class="fas fa-object-intersect"></i>
                            <span>相交</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 样式面板 -->
            <div class="tab-content" id="styles">
                <div class="tool-group">
                    <h3><i class="fas fa-paint-brush"></i> 绘制样式</h3>
                    <div class="style-picker">
                        <div>填充颜色:</div>
                        <div class="color-picker" id="fillColorPicker">
                            <div class="color-option selected" style="background-color: rgba(52, 152, 219, 0.3);" data-color="rgba(52, 152, 219, 0.3)"></div>
                            <div class="color-option" style="background-color: rgba(46, 204, 113, 0.3);" data-color="rgba(46, 204, 113, 0.3)"></div>
                            <div class="color-option" style="background-color: rgba(155, 89, 182, 0.3);" data-color="rgba(155, 89, 182, 0.3)"></div>
                            <div class="color-option" style="background-color: rgba(241, 196, 15, 0.3);" data-color="rgba(241, 196, 15, 0.3)"></div>
                            <div class="color-option" style="background-color: rgba(231, 76, 60, 0.3);" data-color="rgba(231, 76, 60, 0.3)"></div>
                        </div>

                        <div style="margin-top: 15px;">边框颜色:</div>
                        <div class="color-picker" id="strokeColorPicker">
                            <div class="color-option selected" style="background-color: #3498db;" data-color="#3498db"></div>
                            <div class="color-option" style="background-color: #2ecc71;" data-color="#2ecc71"></div>
                            <div class="color-option" style="background-color: #9b59b6;" data-color="#9b59b6"></div>
                            <div class="color-option" style="background-color: #f1c40f;" data-color="#f1c40f"></div>
                            <div class="color-option" style="background-color: #e74c3c;" data-color="#e74c3c"></div>
                        </div>

                        <div style="margin-top: 15px;">边框宽度:</div>
                        <input type="range" id="strokeWidth" min="1" max="10" value="2" style="width: 100%; margin-top: 10px;">
                    </div>
                </div>

                <div class="tool-group">
                    <h3><i class="fas fa-map-marker-alt"></i> 点样式</h3>
                    <div class="style-picker">
                        <div>点大小:</div>
                        <input type="range" id="pointSize" min="3" max="15" value="7" style="width: 100%; margin-top: 10px;">

                        <div style="margin-top: 15px;">点形状:</div>
                        <div class="tool-grid" style="margin-top: 10px;">

            <!-- 数据面板 -->
            <div class="tab-content" id="data">

                    <h3><i class="fas fa-database"></i> 数据管理</h3>
                    <div class="tool-grid">

                            <span>导入</span>

                        <button class="tool-btn" id="dataExport">

                            <span>导出</span>

                            <i class="fas fa-trash"></i>

                <div class="tool-group">
                    <h3><i class="fas fa-table"></i> 属性表</h3>

                                <tr>
                                    <th>ID</th>

                                <!-- 属性数据动态生成 -->
                            </tbody>
                        </table>
